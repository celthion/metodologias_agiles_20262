[build-system]
requires = ["poetry-core>=1.9.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "canticos-futbol"
version = "0.1.0"
authors = ["David Cardona Duque", "Manuela Zapata Jiménez", "Federico Viviescas Ramirez"]
description = "Corpus de cánticos del fútbol profesional colombiano"
packages = [{ include = "canticos_futbol", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^2.2"
pandas = ">=2.2,<4"
scipy = "^1.15"
scikit-learn = "^1.6"
matplotlib = "^3.10"
seaborn = "^0.13"

[tool.poetry.group.notebook.dependencies]
jupyterlab = "^4.3"
ipykernel = ">=6.29,<8"

[[tool.poetry.source]]
name = "fury-pypi"
url = "https://pypi.artifacts.furycloud.io/simple"
priority = "primary"
